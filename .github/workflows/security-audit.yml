name: Security audit

# Prevents security regressions (escaping, nonces/caps, input sanitization,
# $wpdb->prepare, safe redirects, SAST) from being introduced or re-introduced.
# Runs on every push to main and PR, and is called by release.yml as a gate so a
# failing audit blocks the release. Mirrors the local ./audit-plugin.sh security stages.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  security:
    # TEMPORARY PROBE — do not merge. Runs the audit on the current runner and on
    # Ubuntu 26.04 side by side, to find out whether the ubuntu-latest migration
    # (starting 2026-10-19) breaks this workflow. fail-fast is off so a failure on
    # one OS still lets the other finish and be compared.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Report runner and toolchain
        run: |
          echo "runner label: ${{ matrix.os }}"
          cat /etc/os-release | head -3
          echo "--- preinstalled, before setup-php ---"
          php -v 2>/dev/null | head -1 || echo "no ambient php"
          composer -V 2>/dev/null || echo "no ambient composer"
          python3 -V 2>/dev/null || echo "no ambient python3"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install PHPCS + WordPress Coding Standards
        run: |
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction --no-progress \
            "squizlabs/php_codesniffer:^3.13" \
            "wp-coding-standards/wpcs:^3.2" \
            "dealerdirect/phpcodesniffer-composer-installer:^1.0"
          echo "$(composer global config bin-dir --absolute)" >> "$GITHUB_PATH"

      - name: PHPCS — WordPress security rules
        run: |
          phpcs -p --colors --standard=WordPress \
            --sniffs=WordPress.Security.EscapeOutput,WordPress.Security.NonceVerification,WordPress.Security.ValidatedSanitizedInput,WordPress.Security.SafeRedirect,WordPress.DB.PreparedSQL \
            --extensions=php \
            --ignore='*/vendor/*,*/vendor-prefixed/*,*/node_modules/*,*/archive/*,*/llm-markdown/*' \
            site-chat

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Report pinned toolchain
        run: |
          echo "--- after setup-php / setup-python ---"
          php -v | head -1
          composer -V
          python -V
          phpcs --version

      - name: Semgrep SAST (PHP security)
        run: |
          pip install --quiet semgrep
          semgrep --version
          semgrep scan --config p/php --error --quiet --metrics off \
            --exclude vendor --exclude vendor-prefixed --exclude node_modules --exclude archive --exclude llm-markdown \
            site-chat
